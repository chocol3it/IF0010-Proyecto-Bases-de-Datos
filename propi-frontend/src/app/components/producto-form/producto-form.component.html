<h2>{{ codProducto ? 'Editar producto' : 'Nuevo producto' }}</h2>

<p class="error" *ngIf="mensaje()">{{ mensaje() }}</p>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <label>
    Código CABYS
    <input type="text" formControlName="codCabys" maxlength="13" />
  </label>
  <p class="error" *ngIf="form.controls.codCabys.touched && form.controls.codCabys.invalid">
    El código CABYS tiene 13 dígitos.
  </p>

  <label>
    Descripción
    <input type="text" formControlName="desProducto" />
  </label>

  <label>
    Unidad de medida
    <select formControlName="codUnidadMedida">
      <option [ngValue]="0" disabled>Seleccione...</option>
      <option *ngFor="let unidad of unidades()" [ngValue]="unidad.codigo">{{ unidad.descripcion }}</option>
    </select>
  </label>

  <label>
    Precio
    <input type="number" step="0.01" formControlName="monPrecio" />
  </label>

  <label>
    Tipo de impuesto
    <select formControlName="codTipoImpuesto">
      <option [ngValue]="0" disabled>Seleccione...</option>
      <option *ngFor="let impuesto of impuestos()" [ngValue]="impuesto.codTipoImpuesto">
        {{ impuesto.desTipoImpuesto }}
      </option>
    </select>
  </label>

  <label>
    Estado
    <select formControlName="codEstado">
      <option value="A">Activo</option>
      <option value="I">Inactivo</option>
    </select>
  </label>

  <div class="acciones">
    <button type="submit">Guardar</button>
    <a routerLink="/productos">Cancelar</a>
  </div>
</form>
