<h2>{{ codNota ? 'Editar nota' : 'Nueva nota de crédito / débito' }}</h2>

<p class="error" *ngIf="mensaje()">{{ mensaje() }}</p>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <label>
    Factura
    <select formControlName="codFactura">
      <option [ngValue]="0" disabled>Seleccione...</option>
      <option *ngFor="let factura of facturas()" [ngValue]="factura.codFactura">
        N.º {{ factura.codFactura }} - {{ factura.nomCliente }} - total {{ factura.monTotal | number: '1.2-2' }}
      </option>
    </select>
  </label>

  <label>
    Tipo
    <select formControlName="codTipoNota">
      <option [ngValue]="0" disabled>Seleccione...</option>
      <option *ngFor="let tipo of tiposNota()" [ngValue]="tipo.codigo">{{ tipo.descripcion }}</option>
    </select>
  </label>

  <label>
    Motivo
    <textarea formControlName="desMotivo" rows="2"></textarea>
  </label>

  <label>
    Monto
    <input type="number" step="0.01" formControlName="monNota" />
  </label>

  <div class="acciones">
    <button type="submit">Guardar</button>
    <a routerLink="/notas">Cancelar</a>
  </div>
</form>
